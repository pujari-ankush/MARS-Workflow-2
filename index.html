<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircoLife · Service Operations Blueprint (Mumbai) · Draft v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E1F40; --ink2:#4A3A5C; --muted:#6F6180; --line:#EADFE6; --line2:#F3ECF0;
  --purple:#A14996; --purple-d:#7D3374; --purple-l:#F5E6F3; --purple-m:#E3C3DE;
  --blue:#BDE0ED; --blue-d:#246F8E; --blue-l:#EAF5FA;
  --green:#D0F0C0; --green-d:#2F6B2E; --green-l:#EEF9E8;
  --canvas:#FEF9F5; --card:#FFFFFF;
  --p0:#B42318; --p0-l:#FDECEA; --p1:#9A5B00; --p1-l:#FFF3DC; --p2:#246F8E; --p2-l:#EAF5FA;
  --amber:#E7A33C;
  --hero:linear-gradient(115deg,#EBD6F0 0%,#D5ECF6 52%,#E1F5D6 100%);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --font:'Nunito',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--purple-d);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.2}
h1{font-size:28px;font-weight:900;letter-spacing:-.01em}
h2{font-size:21px;font-weight:800}
h3{font-size:16.5px;font-weight:800}
h4{font-size:14px;font-weight:800}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--ink);color:#EFE7F4;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 18px;display:flex;flex-direction:column;gap:14px}
.logo{font-weight:900;font-size:27px;letter-spacing:-.02em;color:#fff;display:flex;align-items:center;gap:2px;padding:0 8px}
.logo .inf{color:#D98BCF;font-size:30px;margin-left:3px;transform:translateY(-1px)}
.tag{font-size:10.5px;letter-spacing:.14em;color:#BFAFCD;padding:0 8px;margin-top:-8px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:10px;color:#E6DCEE;padding:9px 12px;border-radius:999px;font-weight:700;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07);text-decoration:none}
.nav a.on{background:#fff;color:var(--ink)}
.nav a .ix{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;background:rgba(255,255,255,.1);font-weight:800}
.nav a.on .ix{background:var(--purple);color:#fff}
.side .foot{margin-top:auto;font-size:12px;color:#BFAFCD;padding:0 8px}
.scen{background:rgba(255,255,255,.06);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.scen .lbl{font-size:12px;color:#CDBEDA;font-weight:700}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:#E6DCEE;padding:6px 8px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.seg button.on{background:var(--purple);color:#fff}

.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(254,249,245,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);font-weight:700}
.crumbs .sep{opacity:.5}
.navbtns{display:flex;gap:6px}
.pillbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pillbtn:hover{border-color:var(--purple-m)}
.pillbtn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.pillbtn.primary:hover{background:var(--purple-d)}
.pillbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pillbtn.sm{padding:4px 10px;font-size:12px}
.search{margin-left:auto;position:relative}
.search input{width:300px;max-width:52vw;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--purple)}
.sres{position:absolute;right:0;top:44px;width:420px;max-width:90vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(46,31,64,.35);max-height:60vh;overflow:auto;display:none;z-index:40}
.sres a{display:block;padding:9px 14px;border-bottom:1px solid var(--line2);color:var(--ink)}
.sres a:hover{background:var(--purple-l);text-decoration:none}
.sres .k{font-size:11px;color:var(--muted);font-weight:800}

.page{padding:26px 28px 60px;max-width:1360px}
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.phead .sub{color:var(--muted);max-width:760px}

/* Panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.panel + .panel{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:16px}.mt2{margin-top:26px}.mb{margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sechead{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px;flex-wrap:wrap}
.sechead .note{color:var(--muted);font-size:13px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer;white-space:nowrap;line-height:1.5}
.chip:hover{border-color:var(--purple);text-decoration:none}
.chip .av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;color:#fff;background:var(--ink2)}
.chip.vac{border-style:dashed;color:var(--p0)}
.chip.vac .av{background:var(--p0)}
.chip.team .av{border-radius:6px}
.tagx{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.t-bd{background:var(--purple-l);color:var(--purple-d)}
.t-pm{background:var(--blue-l);color:var(--blue-d)}
.t-both{background:#F1ECF5;color:var(--ink2)}
.t-ok{background:var(--green-l);color:var(--green-d)}
.t-p0{background:var(--p0-l);color:var(--p0)}
.t-p1{background:var(--p1-l);color:var(--p1)}
.t-p2{background:var(--p2-l);color:var(--p2)}
.t-grey{background:#F2EEF3;color:var(--muted)}
.t-sla{background:#FFF7E6;color:#8A5300;border:1px solid #F6DDAA}

/* Hero */
.hero{background:var(--hero);border-radius:24px;padding:26px 28px;position:relative;overflow:hidden}
.hero h1{font-size:34px}
.hero .lede{max-width:760px;font-size:16px;color:var(--ink2);margin-top:8px}
.now{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:stretch}
.clock{background:var(--ink);color:#fff;border-radius:18px;padding:16px 20px;min-width:210px}
.clock .t{font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1}
.clock .d{color:#D6C7E2;font-weight:700;margin-top:6px}
.clock .w{margin-top:10px;font-size:12.5px;font-weight:800;border-radius:999px;display:inline-block;padding:3px 10px}
.nowgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nowcard{background:rgba(255,255,255,.72);border-radius:16px;padding:12px 14px;border:1px solid rgba(255,255,255,.9)}
.nowcard h4{font-size:12.5px;color:var(--muted);font-weight:800;margin-bottom:6px}
.nowcard .chips{display:flex;flex-wrap:wrap;gap:5px}

/* Stats */
.stat{padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.stat .v{font-size:28px;font-weight:900;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted);font-weight:700}
.stat.bad{background:var(--p0-l);border-color:#F6C9C3}.stat.bad .v{color:var(--p0)}
.stat.warn{background:var(--p1-l);border-color:#F3D9A6}.stat.warn .v{color:var(--p1)}
.stat.good{background:var(--green-l);border-color:#CFEAC2}.stat.good .v{color:var(--green-d)}

/* Tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;background:#FBF6F9;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#FCF5FA}
.tbl td.wrap{min-width:200px}

/* Workflow map */
.flowtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.flowtools input{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;min-width:220px;background:#fff}
.stage{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;margin-bottom:0;overflow:hidden}
.stage > header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none}
.stage > header .lane{font-size:12px;font-weight:800;color:var(--muted)}
.stage > header .tog{margin-left:auto;font-weight:900;color:var(--muted);transition:transform .2s}
.stage.closed > header .tog{transform:rotate(-90deg)}
.stage.closed .stagebody{display:none}
.stagebody{padding:4px 16px 16px;display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:12px}
.bd .stage{border-left:6px solid var(--purple)}
.pm .stage{border-left:6px solid var(--blue-d)}
.stage .sno{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff}
.bd .stage .sno{background:var(--purple)}
.pm .stage .sno{background:var(--blue-d)}
.node{width:196px;min-height:118px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;transition:border-color .15s, box-shadow .15s}
.node:hover{border-color:var(--purple);box-shadow:0 8px 20px -14px rgba(161,73,150,.6)}
.pm .node:hover{border-color:var(--blue-d);box-shadow:0 8px 20px -14px rgba(36,111,142,.6)}
.node .top1{display:flex;align-items:center;gap:6px}
.node .stp{font-weight:900;font-size:12px;border-radius:999px;padding:1px 8px}
.bd .node .stp{background:var(--purple-l);color:var(--purple-d)}
.pm .node .stp{background:var(--blue-l);color:var(--blue-d)}
.node .act{font-weight:800;font-size:13.5px;line-height:1.3}
.node .own{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.node .own .chip{font-size:11.5px;padding:1px 8px 1px 3px}
.node .own .chip .av{width:16px;height:16px;font-size:9px}
.node .flag{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--p0);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.node .flag.p1{background:var(--amber)}
.node.dim{opacity:.22}
.node.hit{outline:3px solid var(--amber)}
.node.decision{background:#FFFBF2;border-style:dashed;border-color:#E9C98B}
.node.term{background:var(--green-l);border-color:#BFE3AE;min-height:70px}
.arrow{width:26px;display:flex;align-items:center;justify-content:center;color:#C9B6C4;font-weight:900;font-size:18px}
.vlink{display:flex;justify-content:center;padding:6px 0;color:#C9B6C4;font-size:18px;font-weight:900}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.branch{border:1px dashed var(--line);border-radius:14px;padding:10px;background:#FFFCFB}
.branch h4{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.branch .chain{display:flex;flex-wrap:wrap;row-gap:10px;align-items:stretch}
.subs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:100%;margin-top:4px}
.subs div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;background:#FBFDFE}
.subs b{display:block;font-size:11px;color:var(--blue-d)}

/* Drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:94vw;background:#fff;border-left:1px solid var(--line);box-shadow:-24px 0 50px -30px rgba(46,31,64,.45);transform:translateX(105%);transition:transform .25s ease;z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .body{padding:16px 20px 30px;overflow:auto}
.drawer dl{display:grid;grid-template-columns:118px 1fr;gap:9px 12px;margin:0;font-size:13.5px}
.drawer dt{color:var(--muted);font-weight:800;font-size:12.5px}
.drawer dd{margin:0}
.scrim{position:fixed;inset:0;background:rgba(46,31,64,.18);z-index:55;display:none}
.scrim.open{display:block}
.xbtn{margin-left:auto;border:0;background:#F4EEF3;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px;font-weight:900;color:var(--ink)}

/* Issues */
.issue{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:#fff;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.issue + .issue{margin-top:10px}
.issue .pr{grid-row:span 3;font-weight:900;border-radius:10px;padding:4px 8px;height:fit-content;font-size:12.5px}
.issue.p0{border-color:#F4C7C1;background:#FFF8F7}.issue.p0 .pr{background:var(--p0);color:#fff}
.issue.p1{border-color:#F1DDB3;background:#FFFCF5}.issue.p1 .pr{background:var(--amber);color:#fff}
.issue.p2 .pr{background:var(--blue-l);color:var(--blue-d)}
.issue h4{font-size:14.5px}
.issue .q{font-weight:800;color:var(--ink);margin-top:4px}

/* Roster */
.matrix td.cell{text-align:center;font-weight:900;font-size:12px;padding:6px}
.sc{display:inline-block;min-width:34px;border-radius:8px;padding:3px 6px}
.sc.A{background:#F5E6F3;color:var(--purple-d)}
.sc.B{background:var(--blue-l);color:var(--blue-d)}
.sc.G{background:#F1EFE0;color:#5E5A2E}
.sc.X{background:#F4F0F2;color:#A898A6}
.heat{display:grid;grid-template-columns:52px repeat(24,minmax(0,1fr));gap:2px;font-size:10.5px}
.heat .hl{font-weight:800;color:var(--muted);display:flex;align-items:center}
.heat .hc{height:22px;border-radius:4px;display:grid;place-items:center;font-weight:800;font-size:10.5px}
.heat .hh{color:var(--muted);text-align:left;font-weight:700;font-size:10px}
.c0{background:#F7D3CF;color:var(--p0)}
.cbrk{background:#FBE7C4;color:var(--p1)}
.c1{background:#E3F3DA;color:var(--green-d)}
.c2{background:#C9E9B8;color:var(--green-d)}
.c3{background:#A9DA92;color:#1F4F1E}
.gantt{position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;overflow-x:auto}
.gantt .gin{min-width:900px}
.grow{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line2);min-height:38px}
.grow:last-child{border-bottom:0}
.grow .gn{padding:8px 12px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line2);background:#FFFCFA}
.gtrack{position:relative}
.gtrack .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.gbar{position:absolute;top:6px;bottom:6px;border-radius:7px;font-size:11px;font-weight:800;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:default}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--p0);z-index:3}
.nowline::after{content:'now';position:absolute;top:-2px;left:4px;font-size:10px;color:var(--p0);font-weight:900}
.ghead{display:grid;grid-template-columns:170px 1fr;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);font-weight:800}
.ghead .gt{position:relative;height:26px}
.ghead .gt span{position:absolute;top:6px;transform:translateX(-50%)}

/* Calendar */
.cal{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.cal.one{grid-template-columns:54px 1fr}
.cal .ch{background:#FBF6F9;padding:8px;font-weight:900;font-size:12.5px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line2)}
.cal .ch small{display:block;font-weight:700;color:var(--muted);font-size:11px}
.cal .tcol{position:relative;border-right:1px solid var(--line2)}
.cal .tcol span{position:absolute;right:6px;font-size:10.5px;color:var(--muted);font-weight:700;transform:translateY(-50%)}
.cal .dcol{position:relative;border-left:1px solid var(--line2)}
.cal .hline{position:absolute;left:0;right:0;height:1px;background:var(--line2)}
.cb{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 6px;font-size:11px;font-weight:700;line-height:1.25;overflow:hidden;border-left:3px solid transparent}
.k-work{background:#F8F2F7;border-left-color:var(--purple-m);color:var(--ink2)}
.k-pmwork{background:var(--blue-l);border-left-color:#8CC6DC;color:#1E4E63}
.k-mgmt,.k-bd{background:var(--purple-l);border-left-color:var(--purple);color:var(--purple-d)}
.k-pm{background:#DDEFF6;border-left-color:var(--blue-d);color:var(--blue-d)}
.k-esc{background:var(--p0-l);border-left-color:var(--p0);color:var(--p0)}
.k-meeting{background:#EFE9F6;border-left-color:#8D72A8;color:#4C3968}
.k-handover{background:#FFF3DC;border-left-color:var(--amber);color:#7A4A00}
.k-break{background:repeating-linear-gradient(45deg,#F7F4F2,#F7F4F2 6px,#FFFFFF 6px,#FFFFFF 12px);color:#9A8F97;border-left-color:#D9CFD4}
.k-report{background:var(--green-l);border-left-color:#8CCB76;color:var(--green-d)}
.k-flex{background:#F3F0DE;border-left-color:#B8AE55;color:#57511C}
.offday{position:absolute;inset:6px;border-radius:10px;border:1.5px dashed #D9CFD4;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:800;font-size:12px;padding:6px;background:#FCFAFA}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* Bars */
.bar{height:12px;border-radius:999px;background:#F2ECF0;position:relative;overflow:hidden}
.bar > span{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.u-ok{background:#7CC36A}.u-near{background:var(--amber)}.u-over{background:var(--p0)}.u-none{background:#C9BFC6}

/* Cards */
.navcard{display:block;border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px;color:var(--ink);transition:border-color .15s}
.navcard:hover{border-color:var(--purple);text-decoration:none}
.navcard .n{font-weight:900;font-size:15.5px}
.navcard p{color:var(--muted);font-size:13px;margin:.3em 0 0}
.pcard{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.pcard:hover{border-color:var(--purple)}
.pcard .nm{font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px}

ul.clean{margin:.3em 0;padding-left:18px}

.steplink:hover{border-color:var(--purple);text-decoration:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.inputs label{display:flex;flex-direction:column;font-size:12.5px;font-weight:800;color:var(--muted);gap:4px}
.inputs input,.inputs select, select.sel{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-size:14px;color:var(--ink);background:#fff}
.minin{width:58px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font:inherit;font-size:13px;text-align:right}
.banner{border-radius:14px;padding:12px 16px;font-weight:700;font-size:13.5px}
.banner.draft{background:var(--p1-l);color:#6B4200;border:1px solid #F1D9A8}
.banner.synth{background:#FFF0F6;color:#8A1D55;border:1px dashed #E7A6C6}
.banner.info{background:var(--blue-l);color:#1E4E63;border:1px solid #CBE6F1}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.phase{border-left:4px solid var(--purple);padding:4px 0 4px 14px;margin:12px 0}
.phase:nth-child(even){border-left-color:var(--blue-d)}
.hbar{display:flex;height:34px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.hbar div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-weight:700}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.nowgrid{grid-template-columns:1fr 1fr}.branches{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{flex-direction:row;flex-wrap:wrap}.g2,.g3,.g4{grid-template-columns:1fr}.now{grid-template-columns:1fr}.page{padding:18px 14px 50px}.top{padding:10px 14px}.search input{width:100%}}

  .panel,.stage,.tblwrap,.node{break-inside:avoid}

}

function hm(h){const H=Math.floor(h),M=Math.round((h-H)*60);return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')}
function f1(x){return (Math.round(x*10)/10).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1})}
function f0(x){return Math.round(x).toLocaleString('en-IN')}
const P=id=>PEOPLE.find(p=>p.id===id);

function rosterCode(p,d){ if(!p||!p.roster) return null; const r=p.roster[S.scen]||p.roster.A; return r?r[d]:null; }
function hasRoster(p){ return !!rosterCode(p,0); }
function workdays(p){ let n=0; for(let d=0;d<7;d++){const c=rosterCode(p,d); if(c&&c!=='X') n++;} return n; }
function breakFor(pid,d,code){
  if(pid==='anil'){ const b=anilPlan(d).find(x=>x[3]==='break'); return b?[b[0],b[1]]:null; }

  return SHIFTS[code].brk;
}
function inShift(pid,d,t){ const p=P(pid); const c=rosterCode(p,d); if(!c||c==='X') return false; const s=SHIFTS[c]; return t>=s.s&&t<s.e; }
function onDuty(pid,d,t){ if(!inShift(pid,d,t)) return false; const c=rosterCode(P(pid),d); const b=breakFor(pid,d,c); return !(b&&t>=b[0]&&t<b[1]); }
function backupOf(pid){ const p=P(pid); if(!p||!p.backup) return null; const b=p.backup[S.scen]||p.backup.A; return b&&P(b)&&inScen(P(b))?b:(b==='cc'?'cc':null); }
function initials(n){return n.replace(/[()]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function chip(id,opt={}){
  if(id==='tcs') return tcIds().map(t=>chip(t,opt)).join(' ');
  const p=P(id); if(!p) return `<span class="chip">${esc(id)}</span>`;
  const cls=['chip']; if(p.vacant) cls.push('vac'); if(p.team) cls.push('team');
  const out=!inScen(p)?' style="opacity:.5" title="Not in current scenario"':'';
  return `<a class="${cls.join(' ')}" href="#person/${p.id}" onclick="event.stopPropagation()"${out}><span class="av" style="background:${p.vacant?'var(--p0)':p.color}">${initials(p.name)}</span>${esc(p.name)}${opt.role?` <span class="muted" style="font-weight:700">· ${esc(p.role)}</span>`:''}</a>`;
}
function chips(ids){ return (ids||[]).map(i=>chip(i)).join(' '); }
function wfTag(w){ return w==='BD'||w==='bd'?'<span class="tagx t-bd">BD</span>':w==='PM'||w==='pm'?'<span class="tagx t-pm">PM</span>':'<span class="tagx t-both">BD + PM</span>'; }
function srcTag(p){ return p.src==='org'?'<span class="tagx t-p1" title="Not in workbook">Org chart — confirm</span>':p.vacant?'<span class="tagx t-p0">Vacant / unnamed</span>':'<span class="tagx t-ok">Workbook</span>'; }
function stepLink(wf,id){ const st=(wf==='bd'?BD_STEPS:PM_STEPS)[id]; if(!st) return ''; return `<a class="steplink ${wf}" href="#${wf}/${id}" onclick="event.stopPropagation()"><b>${wf.toUpperCase()} ${id}</b>${esc(st.act)}</a>`; }
function ownerMatch(o,pid){ return o===pid || (o==='tcs'&&tcIds().includes(pid)); }

/* =========================== SCHEDULING =========================== */
function blocksFor(pid,d){
  const p=P(pid); const code=rosterCode(p,d);
  if(!code) return {none:true};
  if(code==='X') return {off:true,code};
  const sh=SHIFTS[code]; const out=[];
  const add=(s,e,label,kind,extra)=>{ s=Math.max(s,sh.s); e=Math.min(e,sh.e); if(e<=s) return; if(out.some(b=>s<b.e&&e>b.s)) return; out.push(Object.assign({s,e,label,kind},extra||{})); };
  if(pid==='anil'){ anilPlan(d).forEach(b=>add(b[0],b[1],b[2],b[3],{with:b[4]||[]})); return {code,blocks:out.sort((a,b)=>a.s-b.s)}; }
  const br=breakFor(pid,d,code); add(br[0],br[1],'Break','break');
  if(rosterCode(P('anil'),d)!=='X'){
    anilPlan(d).forEach(b=>{
      if(b[4]&&b[4].includes(pid)) add(b[0],b[1],'With Service Head — '+b[2].replace(/ with (JP|Pradeep|Rakesh)/,''),b[3]==='pm'?'pm':'mgmt');
      (b[5]||[]).forEach(j=>{ if(j[2].includes(pid)) add(j[0],j[1],(b[3]==='esc'?'Escalated / delayed calls with Service Head (Report 3)':'Daily appointment and spare dispatch review — with ASM and Service Head (Report 1)'),b[3]==='esc'?'esc':'meeting'); });
    });
  }
  roleFixed(pid,code,d).forEach(r=>add(r[0],r[1],r[2],r[3]));
  if(code==='A'){ const bk=backupOf(pid); add(sh.e-.5,sh.e,'Handover to Shift B'+(bk&&bk!=='cc'?' ('+P(bk).name+')':''),'handover'); }
  if(code==='B'){ add(sh.s,sh.s+.5,'Take handover and team huddle','handover'); add(sh.e-.5,sh.e,'Close-out and handover note for next morning','handover'); }
  if(code==='G'){ add(sh.s,sh.s+.5,'Start-of-day queue review','handover'); }
  // fill gaps
  const wl=workFor(pid); let k=d; out.sort((a,b)=>a.s-b.s);
  const gaps=[]; let t=sh.s; out.forEach(b=>{ if(b.s>t) gaps.push([t,b.s]); t=Math.max(t,b.e); }); if(t<sh.e) gaps.push([t,sh.e]);
  const wk=(P(pid).wf==='PM'||['mrunal','vivek','rahul','rakhi','siddesh','imran','anuja'].includes(pid))?'pmwork':'work';
  gaps.forEach(g=>{ let s=g[0]; while(g[1]-s>0.01){ const len=Math.min(1.5,g[1]-s); const e=(g[1]-(s+len)<0.5)?g[1]:s+len; out.push({s,e,label:wl[k%wl.length],kind:wk}); k++; s=e; } });
  return {code,blocks:out.sort((a,b)=>a.s-b.s)};
}
function mgmtHours(pid){
  let h=0; const p=P(pid); if(!p||!hasRoster(p)) return 0;
  if(pid==='anil'){ for(let d=0;d<7;d++){ if(rosterCode(p,d)==='X') continue; anilPlan(d).forEach(b=>{ if(!['break','flex'].includes(b[3])) h+=b[1]-b[0]; }); } return h; }
  for(let d=0;d<7;d++){ const r=blocksFor(pid,d); if(!r.blocks) continue; r.blocks.forEach(b=>{ if(b.label.indexOf('Service Head')>=0) h+=b.e-b.s; }); }
  return h;
}

/* =========================== CAPACITY MODEL =========================== */
function vol(){ const v=S.vol; const bd7=v.bd*7, fu7=bd7*v.fuPct/100, bill7=fu7*v.billPct/100, billok=bill7*v.agreePct/100; const pm7=v.pm*7;
  return {bd:bd7,fu:fu7,bill:bill7,billok,esc:bill7-billok,foc:fu7-bill7,pm:pm7,pmfu:pm7*v.pmFuPct/100,fail:pm7*v.failPct/100}; }
const VOLU=['bd','fu','bill','billok','esc','foc','pm','pmfu','fail'];
function tmin(key,i){ const k=key+'|'+i; return S.min[k]!=null?S.min[k]:TASKS[key][i][2]; }
function taskKey(pid){ if(pid==='siddesh'&&S.scen==='B') return 'siddeshB'; if(tcIds().includes(pid)) return 'tcs'; return pid; }
function taskHrs(key,i,wd,share){ const t=TASKS[key][i]; const u=t[1]; const m=tmin(key,i); const V=vol();
  if(u==='day'||u==='dayEach') return m*wd/60; if(u==='week') return m/60; if(u==='month') return m/60/4.33; return (V[u]||0)*m/60*share; }
function capacityFor(pid){
  const p=P(pid); if(!p||!hasRoster(p)||!inScen(p)) return null;
  const v=S.vol, wd=workdays(p); const avail=wd*9, brk=wd*v.brk, meet=pid==='anil'?0:wd*v.meet, fixed=mgmtHours(pid);
  const prod=avail-brk-meet-fixed; const items=[];
  const key=taskKey(pid); const isTC=key==='tcs'; const n=tcIds().length;
  const bk=backupOf(pid); const primShare=(bk&&bk!=='cc')?6/7:1;
  (TASKS[key]||[]).forEach((t,i)=>{ const vu=VOLU.includes(t[1]); const share=isTC?(vu?1/n:1):(vu?primShare:1); const h=taskHrs(key,i,wd,share); items.push({label:t[0],unit:t[1],min:tmin(key,i),h,ref:t[3],key,i,share}); });
  // backup load: cover others' volume tasks on their off day (1/7)
  people().forEach(q=>{ if(q.id===pid) return; if(backupOf(q.id)!==pid) return; const qk=taskKey(q.id); if(qk==='tcs') return;
    let h=0; (TASKS[qk]||[]).forEach((t,i)=>{ if(VOLU.includes(t[1])) h+=taskHrs(qk,i,0,1/7); });
    if(h>0) items.push({label:'Backup cover for '+q.name+' on weekly off (1/7 of volume)',unit:'backup',min:null,h,ref:'roster',key:null}); });
  const assigned=items.reduce((a,b)=>a+b.h,0);
  return {wd,avail,brk,meet,fixed,prod,assigned,util:prod>0?assigned/prod:(assigned>0?9:0),items};
}
function ccHours(){ let h=0; TASKS.cc.forEach((t,i)=>h+=taskHrs('cc',i,6,1)); return h; }
function ccFTE(){ return ccHours()/(54-6*S.vol.brk-6*S.vol.meet); }
function techCap(){ const v=S.vol,V=vol(); const bdD=(V.bd+V.fu)*v.bdVisitMin/60, bdC=v.techBD*6*(9-v.brk); const pmD=(V.pm+V.pmfu)*v.pmVisitMin/60, pmC=v.pmTeams*6*(9-v.brk); return {bdD,bdC,pmD,pmC}; }
function ustat(u){ if(u==null) return ['none','—']; if(u>1) return ['over','Over capacity']; if(u>=.85) return ['near','Near capacity']; return ['ok','Under capacity']; }
function ubar(u,w){ const [c]=ustat(u); const pct=Math.min(u*100/1.5,100); return `<div class="bar" style="width:${w||160}px" title="${u==null?'':Math.round(u*100)+'%'}"><span class="u-${c}" style="width:${pct}%"></span><i class="cap" style="left:${100/1.5}%"></i></div>`; }

/* =========================== COVERAGE =========================== */
function covGroups(){ const B=S.scen==='B'; return [
  {n:'Escalation authority',ids:['anil','jp','pradeep'],why:'Someone who can approve, escalate and decide must be on duty every hour.'},
  {n:'BD Service Coordination',ids:B?['rakesh','shakeel','vishal']:['rakesh','shakeel'],why:'Appointment verification, technician supervision and follow-ups.'},
  {n:'PM Technician Coordination',ids:tcIds(),why:'PM dispatch, technician follow-up and W/O closure.'},
  {n:'Data entry (DEO)',ids:B?['karan','siddesh']:['karan'],why:'Ticket → Request → W/O → Appointment creation (CC co-owns).'},
  {n:'BD ASM — JP only',ids:['jp'],why:'Primary-owner presence; backup is Pradeep.'},
  {n:'PM ASM — Pradeep only',ids:['pradeep'],why:'Primary-owner presence; backup is JP.'},
  {n:'Tools and spares',ids:['mahesh'],why:'Spare release after zero invoice / invoice (owner to confirm).'}
];}
function covCell(ids,d,t){ let r=0,n=0; ids.forEach(i=>{ if(inShift(i,d,t)) r++; if(onDuty(i,d,t)) n++; }); return {r,n}; }
function covStats(ids){ let ok=0,brk=0,gap=0; for(let d=0;d<7;d++) for(let t=WIN.s;t<WIN.e;t+=.5){ const c=covCell(ids,d,t); if(c.n>0) ok++; else if(c.r>0) brk++; else gap++; } return {ok,brk,gap,pct:ok/168,gapH:gap/2,brkH:brk/2}; }
function heatmap(ids){
  let h=`<div class="heat"><div></div>`; for(let t=WIN.s;t<WIN.e;t+=.5) h+=`<div class="hh">${t%1===0?hm(t).slice(0,2):''}</div>`;
  for(let d=0;d<7;d++){ h+=`<div class="hl">${DAYS[d]}</div>`; for(let t=WIN.s;t<WIN.e;t+=.5){ const c=covCell(ids,d,t); const cls=c.r===0?'c0':c.n===0?'cbrk':c.n===1?'c1':c.n===2?'c2':'c3'; const who=ids.filter(i=>onDuty(i,d,t)).map(i=>P(i).name).join(', ')||(c.r?'All rostered staff on break':'Nobody rostered');
    h+=`<div class="hc ${cls}" title="${DAYS[d]} ${hm(t)}–${hm(t+.5)}: ${esc(who)}">${c.n||(c.r?'b':'×')}</div>`; } }
  return h+'</div>';
}
</script>

function nodeHTML(wf,id){

  return `<div class="node" tabindex="0" data-wf="${wf}" data-step="${id}" data-own="${st.o.join(' ')} ${st.o.includes('tcs')?tcIds().join(' '):''}" data-txt="${esc((st.act+' '+names+' '+st.fsm+' '+st.sla).toLowerCase())}" onclick="stepClick('${wf}','${id}')" onkeydown="if(event.key==='Enter')stepClick('${wf}','${id}')">

    <div class="top1"><span class="stp">${id}</span>${st.sla?`<span class="tagx t-sla" style="font-size:10.5px">${esc(st.sla.split(' ')[0].replace('Within','')||'SLA')}</span>`:''}</div>
    <div class="act">${esc(st.act)}</div>
    ${st.subs?`<div class="tiny muted">7A–7G: trip, work, asset, job sheet</div>`:''}
    <div class="own">${st.o.map(o=>chip(o)).join('')}</div></div>`;
}
const AR='<div class="arrow" aria-hidden="true">›</div>';
function chainHTML(wf,ids){ return ids.map((id,i)=>nodeHTML(wf,id)+(i<ids.length-1?AR:'')).join(''); }
function pgFlow(wf){
  const isBD=wf==='bd'; const stages=isBD?BD_STAGES:PM_STAGES; const gov=isBD?BD_GOV:PM_GOV;
  const visible=id=>{ if(isBD) return true; const v=PM_STEPS[id].variants; return !v||v[S.pmVar]; };
  const owners=[...new Set(Object.values(isBD?BD_STEPS:PM_STEPS).flatMap(s=>s.o.flatMap(o=>o==='tcs'?tcIds():[o])))];
  let html=`<div class="phead"><div><h1>${isBD?'BD workflow — Breakdown ticket':'PM workflow — Scheduled / planned maintenance'}</h1><p class="sub">${isBD?'Every step from ticket raise to closure, including the follow-up, FoC, billable and escalation paths. Select a step for owner, SLA, output, next step, escalation and Zoho FSM object.':'Every step from monthly plan to ASM-verified closure. The workbook has two variants: Planned PM and PM Ticket. Select a step for details.'}</p></div></div>
  <div class="flowtools noprint">
    <input id="ff" type="search" placeholder="Filter steps (e.g. RCA, invoice, Rakesh)" oninput="flowFilter()">
    <select class="sel" id="fo" onchange="flowFilter()"><option value="">All owners</option>${owners.map(o=>`<option value="${o}">${esc(P(o).name)}</option>`).join('')}</select>
    ${!isBD?`<span class="tabs" style="margin:0"><button class="pillbtn sm ${S.pmVar==='planned'?'on':''}" onclick="S.pmVar='planned';route()">Planned PM</button><button class="pillbtn sm ${S.pmVar==='ticket'?'on':''}" onclick="S.pmVar='ticket';route()">PM Ticket</button></span>`:''}
    <button class="pillbtn sm" onclick="document.querySelectorAll('.stage').forEach(s=>s.classList.remove('closed'))">Expand all</button>
    <button class="pillbtn sm" onclick="document.querySelectorAll('.stage').forEach(s=>s.classList.add('closed'))">Collapse all</button>
    <span class="legend" style="margin-left:auto"><span><span class="flag" style="position:static;display:inline-grid;width:16px;height:16px;background:var(--p0);color:#fff;border-radius:50%;font-size:10px;place-items:center">!</span> P0 issue</span><span><span style="display:inline-grid;width:16px;height:16px;background:var(--amber);color:#fff;border-radius:50%;font-size:10px;place-items:center">!</span> P1 issue</span></span>
  </div><div class="${wf}">`;
  stages.forEach((sg,si)=>{
    if(sg.variant&&sg.variant!==S.pmVar) return;
    const ids=sg.steps.filter(visible);
    html+=`<section class="stage" id="stg-${sg.k}"><header onclick="this.parentElement.classList.toggle('closed')"><span class="sno">${si+1}</span><div><h3>${esc(sg.n)}</h3><div class="lane">${esc(sg.lane)}</div></div><span class="tog">▾</span></header><div class="stagebody">${chainHTML(wf,ids)}`;
    if(sg.decision){ html+=AR+`<div class="node decision"><div class="top1"><span class="stp" style="background:#FFF1D6;color:#8A5300">${sg.decision.id}</span></div><div class="act">${esc(sg.decision.q)}</div><div class="tiny"><b>No</b> → ${esc(sg.decision.no)}<br><b>Yes</b> → ${esc(sg.decision.yes)}</div></div>`; }
    if(sg.branches){ html+=`<div class="branches">${sg.branches.map(b=>`<div class="branch"><h4>${esc(b.h)}</h4><div class="chain">${b.chain.length?chainHTML(wf,b.chain.filter(visible)):'<div class="node term"><div class="act">Continue to closure</div><div class="tiny muted">Go to stage ${stages.length}</div></div>'}</div></div>`).join('')}</div>`; }
    if(sg.end) html+=AR+`<div class="node term"><div class="act">${esc(sg.end)}</div></div>`;
    html+=`</div></section>`;
    if(si<stages.length-1) html+=`<div class="vlink" aria-hidden="true">⌄</div>`;
  });
  html+=`</div>`;
  if(isBD) html+=`<div class="panel mt"><h3>Routing notes</h3><ul class="clean small"><li>FoC path: 13 → 14 → 17. Billable path: 13 → 15 → 16 → 17 (customer agrees and pays). Disagreement: 15 → 23 → 24, where the ASM runs steps 14 to 20 personally.</li><li>Steps 19 and 7 are the same field routine (7A–7G) and produce the Trips, timesheet, asset and job-sheet evidence the dashboards rely on.</li><li>Targets written in the workbook’s responsibility column apply to the step groups beside them: SC1 T+1 for 90% (steps 4–10), SC2 T+2 for follow-up visit (11–22), SC3 T+4 for billable discussion (15–16, 23–24).</li></ul></div>`;
  else html+=`<div class="panel mt"><h3>Automation opportunity in Zoho FSM</h3><p class="small">The workbook marks PM step 3 “Eliminate (CC)” and step 4 “Auto”. Zoho FSM Scheduled Maintenance can generate PM work orders from a maintenance plan per asset, removing manual request creation and making <b>PM planned</b> and <b>PM due</b> directly measurable. Until then PM 1 data comes from FSM or GSheet and must be reconciled manually. Confirm your FSM edition supports this before relying on it.</p></div>`;
  html+=`<div class="sechead"><h2>${isBD?'BD':'PM'} governance, reviews and administration</h2><span class="note">From the lower sections of the ${isBD?'BD Ticket':'PM ScheduledTicket'} sheet</span></div>`;
  gov.forEach(g=>{ html+=`<div class="panel"><h3>${esc(g.g)}</h3><div class="tblwrap mt"><table class="tbl"><tr><th>Activity</th><th>Position (workbook)</th><th>Person (workbook)</th><th>Mapped to</th><th>Report / cadence</th></tr>${g.rows.map(r=>`<tr><td>${esc(r[0])}${r[5]?` <span class="tagx t-${r[5]}">${r[5].toUpperCase()}</span>`:''}</td><td class="small">${esc(r[1])}</td><td class="small muted">${esc(r[2])}</td><td>${chips(r[3])}</td><td class="small">${esc(r[4])||'<span class="muted">—</span>'}</td></tr>`).join('')}</table></div></div>`; });
  return html;
}

function ownedSteps(pid){ const r={bd:[],pm:[],bdSup:[],pmSup:[]};

   <span class="small muted" style="font-weight:800;margin-left:10px">Workflow</span>${['all','BD','PM'].map(g=>`<button class="pillbtn sm ${S.pWf===g?'on':''}" onclick="S.pWf='${g}';route()">${g==='all'?'All':g}</button>`).join('')}</div>
  ${grps.filter(g=>list.some(p=>p.grp===g)).map(g=>`<div class="sechead"><h2>${g}</h2></div><div class="grid g4">${list.filter(p=>p.grp===g).map(card).join('')}</div>`).join('')}

const HPX=44;
function calendarHTML(pid,view,day){
  const p=P(pid); const days=view==='day'?[day]:[0,1,2,3,4,5,6];
  let h=`<div class="cal ${view==='day'?'one':''}"><div class="ch" style="border-left:0"></div>`;
  days.forEach(d=>{ const c=rosterCode(p,d); h+=`<div class="ch">${DAYSL[d].slice(0,view==='day'?9:3)}<small>${c==='X'?'Weekly off':c?SHIFTS[c].name+' · '+SHIFTS[c].time:'—'}</small></div>`; });
  const H=(WIN.e-WIN.s)*HPX;
  h+=`<div class="tcol" style="height:${H}px">${Array.from({length:13},(_,i)=>`<span style="top:${i*HPX}px">${i===0?'':hm(WIN.s+i)}</span>`).join('')}</div>`;
  days.forEach(d=>{
    h+=`<div class="dcol" style="height:${H}px">${Array.from({length:12},(_,i)=>`<div class="hline" style="top:${i*HPX}px"></div>`).join('')}`;
    const r=blocksFor(pid,d);
    if(r.off){ const bk=backupOf(pid); h+=`<div class="offday">Weekly off${bk?`<br><span class="tiny">Backup: ${bk==='cc'?'CC':esc(P(bk).name)}</span>`:''}<br><span class="tiny">KPI stays with ${esc(p.name)}</span></div>`; }
    else if(r.blocks){ r.blocks.forEach(b=>{ const top=(b.s-WIN.s)*HPX, ht=(b.e-b.s)*HPX-2; h+=`<div class="cb k-${b.kind}" style="top:${top}px;height:${ht}px" title="${hm(b.s)}–${hm(b.e)} · ${esc(b.label)}"><b class="num">${hm(b.s)}</b> ${esc(b.label)}</div>`; }); }
    if(d===todayIdx()){ const t=nowH(); if(t>=WIN.s&&t<WIN.e) h+=`<div class="nowline" style="left:0;right:0;width:auto;height:2px;top:${(t-WIN.s)*HPX}px"></div>`; }
    h+='</div>';
  });
  return h+'</div>';
}

  out.push(`<div class="panel mt"><h3>3–5 · Responsibilities in the workflows</h3>
    <div class="grid g2 mt"><div><h4>BD steps owned</h4><div class="mt">${stepsBlock('bd',o.bd)}</div>${o.bdSup.length?`<h4 class="mt">BD steps supported</h4><div class="mt">${stepsBlock('bd',o.bdSup)}</div>`:''}</div>
    <div><h4>PM steps owned</h4><div class="mt">${stepsBlock('pm',o.pm)}</div>${o.pmSup.length?`<h4 class="mt">PM steps supported</h4><div class="mt">${stepsBlock('pm',o.pmSup)}</div>`:''}</div></div></div>`);
  out.push(`<div class="grid g3 mt"><div class="panel"><h3>6 · Daily</h3>${govList('Daily')}${dayTasks.length?`<div class="tiny muted mt">Plus daily discipline: ${dayTasks.map(t=>esc(t.label)).join('; ')}</div>`:''}</div><div class="panel"><h3>7 · Weekly</h3>${govList('Weekly')}</div><div class="panel"><h3>8 · Monthly / ongoing</h3>${govList('Monthly')}${govList('Ongoing / as required')}</div></div>`);
  if(c){ const [cl,lab]=ustat(c.util);
    out.push(`<div class="panel mt"><div class="row"><h3>13 · Capacity vs assigned workload</h3><span class="tagx ${cl==='over'?'t-p0':cl==='near'?'t-p1':'t-ok'}">${lab} · ${Math.round(c.util*100)}%</span><span class="small muted">Placeholder volumes and minutes — calibrate from FSM. <a href="#live">Edit inputs</a></span></div>
      <div class="grid g4 mt"><div class="stat"><div class="v num">${f1(c.avail)}</div><div class="l">Rostered h / week (${c.wd} days)</div></div><div class="stat"><div class="v num">−${f1(c.brk+c.meet)}</div><div class="l">Breaks + huddles / handovers</div></div><div class="stat"><div class="v num">−${f1(c.fixed)}</div><div class="l">Fixed management time${pid==='anil'?' (6 h/day)':' (with Service Head)'}</div></div><div class="stat ${cl==='over'?'bad':cl==='near'?'warn':'good'}"><div class="v num">${f1(c.assigned)} / ${f1(c.prod)}</div><div class="l">Assigned vs productive h</div></div></div>
      <div class="tblwrap mt"><table class="tbl"><tr><th>Activity</th><th>Driver</th><th>Min / unit</th><th>Hours / week</th><th>Ref</th></tr>${c.items.map(i=>`<tr><td>${esc(i.label)}</td><td class="small">${esc(unitLabel(i.unit))}${i.share&&i.share<1?` × ${f1(i.share*100)}%`:''}</td><td class="num">${i.min==null?'—':i.min}</td><td class="num"><b>${f1(i.h)}</b></td><td class="small muted">${esc(i.ref)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No workbook activities assigned — see open questions.</td></tr>'}</table></div></div>`); }
  else if(p.id==='cc'){ out.push(`<div class="panel mt"><h3>13 · Capacity</h3><p class="small">CC headcount is not in the workbook. At current placeholder volumes the CC activities in the workflows need <b>${f1(ccHours())} h/week ≈ ${f1(ccFTE())} FTE</b>. For 7 × 12 coverage one seat needs at least 2 people (84 h ÷ 54 h).</p></div>`); }
  else if(p.id==='tech_bd'||p.id==='tech_pm'){ const t=techCap(); const bd=p.id==='tech_bd'; const u=bd?t.bdD/t.bdC:t.pmD/t.pmC; out.push(`<div class="panel mt"><h3>13 · Team capacity</h3><div class="row">${ubar(u,240)} <b class="num">${Math.round(u*100)}%</b> <span class="small muted">${bd?`${S.vol.techBD} technicians`:`${S.vol.pmTeams} vendor teams (to confirm)`} × 6 days × ${9-S.vol.brk} h · demand ${f0(bd?t.bdD:t.pmD)} h/week at ${bd?S.vol.bdVisitMin:S.vol.pmVisitMin} min per visit incl. travel (placeholder)</span></div></div>`); }
  out.push(liveForPerson(pid));
  if(hasRoster(p)){
    out.push(`<div class="sechead"><h2>12 · 7-day calendar</h2><span class="note">Proposed roster — scenario ${S.scen==='A'?'Workbook':'+ Org chart'}</span></div>
    <div class="row noprint mb"><button class="pillbtn sm ${S.calView==='week'?'on':''}" onclick="S.calView='week';route()">Week</button><button class="pillbtn sm ${S.calView==='day'?'on':''}" onclick="S.calView='day';route()">Day</button>${S.calView==='day'?DAYS.map((d,i)=>`<button class="pillbtn sm ${S.calDay===i?'on':''}" onclick="S.calDay=${i};route()">${d}</button>`).join(''):''}
    <select class="sel" onchange="go('person/'+this.value)" aria-label="Switch person">${people().filter(hasRoster).map(q=>`<option value="${q.id}" ${q.id===pid?'selected':''}>${esc(q.name)} — ${esc(q.role)}</option>`).join('')}</select></div>
    ${calendarHTML(pid,S.calView,S.calDay)}${CAL_LEGEND}`);
  } else out.push(`<div class="panel mt"><h3>12 · 7-day calendar</h3><div class="empty">${p.vacant?'Vacant or unnamed — no one to roster. See open questions.':p.team?'Team without named members or headcount in the workbook. Roster requirement is shown on the 7-Day Roster page.':'No roster.'}</div></div>`);
  out.push(`<div class="row mt2"><a class="pillbtn" href="#roster">7-day roster</a><a class="pillbtn" href="#bd">BD workflow</a><a class="pillbtn" href="#pm">PM workflow</a><a class="pillbtn primary" href="#home">Home</a></div>`);
  return out.join('');
}
function unitLabel(u){ return {bd:'per BD ticket',fu:'per BD follow-up',foc:'per FoC follow-up',bill:'per billable case',billok:'per accepted billable',esc:'per escalated case',pm:'per PM visit',pmfu:'per PM follow-up',fail:'per machine failure',day:'per working day',dayEach:'per coordinator per day',week:'per week',month:'per month',backup:'weekly-off cover'}[u]||u; }

/* =========================== ROSTER =========================== */
function pgRoster(){
  const d=S.rDay; const ps=people().filter(hasRoster).filter(p=>S.rFilter==='all'||p.grp===S.rFilter);
  const offs=people().filter(hasRoster).filter(p=>rosterCode(p,d)==='X');
  const t=nowH(); const isToday=d===todayIdx();
  const gh=`<div class="ghead"><div style="padding:6px 12px">Person</div><div class="gt">${Array.from({length:13},(_,i)=>`<span style="left:${i/12*100}%">${hm(WIN.s+i)}</span>`).join('')}</div></div>`;
  const rows=ps.map(p=>{ const r=blocksFor(p.id,d); let bars='';
    if(r.off) bars=`<div class="gbar" style="left:0;right:0;background:repeating-linear-gradient(45deg,#FAF6F8,#FAF6F8 8px,#fff 8px,#fff 16px);color:var(--muted);border:1px dashed #E3D7DE">Weekly off — backup ${backupOf(p.id)?(backupOf(p.id)==='cc'?'CC':esc(P(backupOf(p.id)).name)):'not defined'}</div>`;
    else if(r.blocks) bars=r.blocks.map(b=>`<div class="gbar k-${b.kind}" style="left:${(b.s-WIN.s)/12*100}%;width:calc(${(b.e-b.s)/12*100}% - 2px)" title="${hm(b.s)}–${hm(b.e)} ${esc(b.label)}">${esc(b.label)}</div>`).join('');
    return `<div class="grow"><div class="gn"><a href="#person/${p.id}">${esc(p.name)}</a> <span class="sc ${r.code||'X'}" style="min-width:24px;font-size:10.5px">${r.code==='X'?'off':r.code}</span></div><div class="gtrack">${Array.from({length:13},(_,i)=>`<div class="gl" style="left:${i/12*100}%"></div>`).join('')}${bars}${isToday&&t>=WIN.s&&t<WIN.e?`<div class="nowline" style="left:${(t-WIN.s)/12*100}%"></div>`:''}</div></div>`; }).join('');
  const matrix=people().filter(hasRoster).map(p=>`<tr class="click" onclick="go('person/${p.id}')"><td>${chip(p.id)}</td><td class="small">${esc(p.role)}</td>${DAYS.map((x,i)=>{const c=rosterCode(p,i);return `<td class="cell"><span class="sc ${c}">${c==='X'?'off':c}</span></td>`}).join('')}<td class="num">${workdays(p)} × 9 h</td><td>${backupOf(p.id)?(backupOf(p.id)==='cc'?chip('cc'):chip(backupOf(p.id))):'<span class="tagx t-p0">None</span>'}</td></tr>`).join('');
  const G=covGroups();
  const covRows=G.map(g=>{ const s=covStats(g.ids); const n=g.ids.length; return `<tr><td><b>${esc(g.n)}</b><div class="tiny muted">${esc(g.why)}</div></td><td>${chips(g.ids)}</td><td class="num">${n} × 54 = ${n*54} h</td><td class="num">84 h</td><td class="num">${Math.ceil(84/54)}</td><td class="num"><b>${Math.round(s.pct*100)}%</b></td><td class="num">${f1(s.gapH)} h</td><td class="num">${f1(s.brkH)} h</td></tr>`; }).join('');
  const acct=ACCT().map(a=>`<tr><td><b>${esc(a[0])}</b> ${wfTag(a[1])}</td><td>${chips(a[2])}</td><td>${chips(a[3])}</td><td>${chip(a[4])}</td><td class="small">${esc(a[5])}</td></tr>`).join('');
  return `<div class="phead"><div><h1>7-day operating roster</h1><p class="sub">Coverage 7 days × 12 hours (08:00–20:00, assumed) with each person on 6 days × ~9 hours and one weekly off. Staggered Shift A (08:00–17:00) and Shift B (11:00–20:00) overlap for 6 hours; handovers at 11:00 and 16:30–17:00; staggered breaks keep someone on duty.</p></div></div>
  <div class="banner draft mb">Proposed roster, not yet valid: depends on P0-1 (hours), P0-3 (SC headcount), P0-5 (CC), P0-6 (coordinators) and P0-7 (technician shifts). Switch the headcount scenario in the sidebar to compare.</div>
  <div class="sechead"><h2>Weekly roster matrix</h2></div>
  <div class="tblwrap"><table class="tbl matrix"><tr><th>Person</th><th>Role</th>${DAYS.map(x=>`<th style="text-align:center">${x}</th>`).join('')}<th>Load</th><th>Backup</th></tr>${matrix}</table></div>
  <div class="panel mt"><h3>Roster requirements for teams without named people</h3><ul class="clean small">
   <li>${chip('cc')} At least one CC seat in Shift A and one in Shift B every day → minimum 2 people for a single seat (84 ÷ 54 h), 3–4 for two seats with weekly offs. Current workload model needs ≈ <b>${f1(ccFTE())} FTE</b>.</li>
   <li>${chip('tech_bd')} 26 technicians, 6-day week → ≈ ${f1(26*6/7)} available per day. Weekly offs should be spread ≈ 3–4 per day and split across Rakesh’s 16 and Shakeel’s 6+4 teams. Shift split (A / B) depends on P0-7.</li>
   <li>${chip('tech_pm')} Vendor team offs agreed with each vendor; coordinators track availability daily (PM admin 1).</li></ul></div>
  <div class="sechead"><h2>Day view</h2><div class="row noprint">${DAYS.map((x,i)=>`<button class="pillbtn sm ${d===i?'on':''}" onclick="S.rDay=${i};route()">${x}${i===todayIdx()?' · today':''}</button>`).join('')}</div>
   <select class="sel noprint" onchange="S.rFilter=this.value;route()">${['all','Management','Coordination','Intake','Support'].map(g=>`<option value="${g}" ${S.rFilter===g?'selected':''}>${g==='all'?'All roles':g}</option>`).join('')}</select></div>
  <div class="small mb"><b>Off on ${DAYSL[d]}:</b> ${offs.map(p=>chip(p.id)).join(' ')||'—'}</div>
  <div class="gantt"><div class="gin">${gh}${rows}</div></div>${CAL_LEGEND}
  <div class="sechead"><h2>Coverage heatmaps</h2><span class="note">Number on duty per half hour · <b>×</b> nobody rostered · <b>b</b> rostered but all on break</span></div>
  <div class="grid g2">${G.map(g=>`<div class="panel"><div class="row"><h3>${esc(g.n)}</h3><span class="tagx ${covStats(g.ids).pct>=.999?'t-ok':'t-p0'}">${Math.round(covStats(g.ids).pct*100)}% covered</span></div><div class="mt">${heatmap(g.ids)}</div></div>`).join('')}</div>
  <div class="sechead"><h2>Coverage arithmetic</h2><span class="note">One seat for 84 h/week needs at least two people at 54 h each</span></div>
  <div class="tblwrap"><table class="tbl"><tr><th>Coverage group</th><th>People</th><th>Rostered hours</th><th>Seat need</th><th>Min people / seat</th><th>Covered</th><th>No one rostered</th><th>All on break</th></tr>${covRows}</table></div>
  <div class="sechead"><h2>Accountability and backup</h2><span class="note">Primary keeps the KPI; the backup is accountable only for actions during cover</span></div>
  <div class="tblwrap"><table class="tbl"><tr><th>Process area</th><th>Primary owner</th><th>Backup</th><th>Escalation owner</th><th>Handover rule</th></tr>${acct}</table></div>
  <div class="panel mt"><h3>Handover protocol (proposed)</h3><div class="grid g3 mt small">
   <div><h4>11:00 — Shift B joins</h4><p>Five-minute huddle per team: open appointments, customer callbacks, spare status, escalations. Shift A owner remains owner of items already in progress.</p></div>
   <div><h4>16:30–17:00 — Shift A hands over</h4><p>Handover note per queue (FSM W/O note or Cliq channel — to confirm): what is open, who is waiting, what is due before 20:00. Receiving person acknowledges.</p></div>
   <div><h4>Before a weekly off</h4><p>Owner tags the backup on every item due the next day. On return, the owner reviews what the backup did. KPIs are reported under the primary owner.</p></div></div></div>`;
}
</script>
<script>
/* =========================== SERVICE HEAD =========================== */
const SH_NEED={bd:2.5,pm:1.5,esc:2};
function shAlloc(d){ const r={bd:0,pm:0,esc:0,break:0,flex:0}; if(rosterCode(P('anil'),d)==='X') return null; anilPlan(d).forEach(b=>{ r[b[3]]=(r[b[3]]||0)+(b[1]-b[0]); }); return r; }
function shEscOwner(d){ const on=['jp','pradeep'].filter(x=>rosterCode(P(x),d)&&rosterCode(P(x),d)!=='X'); return on; }
function pgSH(){
  const d=S.shDay, anil=P('anil'), code=rosterCode(anil,d), t=nowH(), isToday=d===todayIdx();
  const plan=code==='X'?[]:anilPlan(d);
  const gh=`<div class="ghead"><div style="padding:6px 12px">Service Head</div><div class="gt">${Array.from({length:13},(_,i)=>`<span style="left:${i/12*100}%">${hm(WIN.s+i)}</span>`).join('')}</div></div>`;
  const bars=code==='X'?`<div class="gbar" style="left:0;right:0;background:repeating-linear-gradient(45deg,#FAF6F8,#FAF6F8 8px,#fff 8px,#fff 16px);color:var(--muted);border:1px dashed #E3D7DE">Weekly off — escalation owner: ${shEscOwner(d).map(x=>esc(P(x).name)).join(' (BD) / ')||'not defined'}</div>`
    : plan.map(b=>`<div class="gbar k-${b[3]}" style="left:${(b[0]-WIN.s)/12*100}%;width:calc(${(b[1]-b[0])/12*100}% - 2px)" title="${hm(b[0])}–${hm(b[1])} ${esc(b[2])}">${esc(b[2])}</div>`).join('');
  const withRows=code==='X'?'':plan.map(b=>`<tr><td class="num">${hm(b[0])}–${hm(b[1])}</td><td><span class="tagx ${b[3]==='esc'?'t-p0':b[3]==='bd'?'t-bd':b[3]==='pm'?'t-pm':b[3]==='break'?'t-grey':'t-p1'}">${{esc:'Escalations',bd:'BD ASM',pm:'PM ASM',break:'Break',flex:'Analysis / admin'}[b[3]]}</span></td><td>${esc(b[2])||'<span class="muted">Buffer</span>'}</td><td>${chips(b[4]||[])}${(b[5]||[]).map(j=>` <span class="tiny muted">${hm(j[0])}–${hm(j[1])}:</span> ${chips(j[2])}`).join('')}</td></tr>`).join('');
  const A=shAlloc(d);
  const seg=(k,lab,bg,fg)=>A&&A[k]>0?`<div style="flex:${A[k]};background:${bg};color:${fg||'#fff'}" title="${lab} ${f1(A[k])} h">${lab} ${f1(A[k])} h</div>`:'';
  const hb=A?`<div class="hbar">${seg('bd','BD ASM','var(--purple)')}${seg('pm','PM ASM','var(--blue-d)')}${seg('esc','Escalations','var(--p0)')}${seg('break','Break','#CFC4CC','var(--ink2)')}${seg('flex','Everything else','#B8AE55')}</div>`:'<div class="empty">Weekly off</div>';
  const week=DAYS.map((x,i)=>{ const a=shAlloc(i); const c=rosterCode(anil,i);
    if(!a) return `<tr class="click" onclick="S.shDay=${i};route()"><td><b>${x}</b></td><td><span class="sc X">off</span></td><td colspan="4" class="small">Escalation owner: ${shEscOwner(i).map(chip).join(' ')} (on-duty ASMs — P0-2)</td><td><span class="tagx t-p1">Cover</span></td></tr>`;
    const ok=['bd','pm','esc'].every(k=>a[k]>=SH_NEED[k]-.01);
    return `<tr class="click" onclick="S.shDay=${i};route()"><td><b>${x}</b></td><td><span class="sc ${c}">${c}</span></td>${['bd','pm','esc'].map(k=>`<td class="num ${a[k]<SH_NEED[k]-.01?'':''}">${f1(a[k])} / ${f1(SH_NEED[k])}</td>`).join('')}<td class="num">${f1(a.flex)} h</td><td>${ok?'<span class="tagx t-ok">Mandatory met</span>':'<span class="tagx t-p0">Short</span>'}</td></tr>`; }).join('');
  const c=capacityFor('anil'); const [cl,lab]=c?ustat(c.util):['none','—'];
  const weekFlex=DAYS.reduce((s,x,i)=>{const a=shAlloc(i);return s+(a?a.flex:0)},0);
  const nowB=isToday&&code!=='X'?plan.find(b=>t>=b[0]&&t<b[1]):null;
  return `<div class="phead"><div><h1>Service Head schedule — ${esc(anil.name)}</h1><p class="sub">Mandatory daily blocks: <b>2.5 h BD ASM</b> (JP), <b>1.5 h PM ASM</b> (Pradeep) and <b>2 h escalated / delayed cases</b>. The remaining time must carry every weekly and monthly duty the workbook assigns to the Service Head.</p></div><div class="row" style="margin-left:auto"><a class="pillbtn" href="#person/anil">Person page</a></div></div>
  <div class="banner draft mb">Shift times, block times and task durations are assumptions (P0-1, P0-2). The BD and PM daily reviews (Reports 1–3) are drafted <i>inside</i> the ASM sessions; if they are extra, the Service Head is further over capacity.</div>
  ${isToday?`<div class="banner info mb"><b>Now ${hm(t)}:</b> ${code==='X'?'Service Head on weekly off — route escalations to '+shEscOwner(d).map(x=>esc(P(x).name)).join(' / '):nowB?esc(nowB[2]||'Buffer')+' ('+hm(nowB[0])+'–'+hm(nowB[1])+')':'Outside Service Head shift ('+esc(SHIFTS[code].time)+')'}</div>`:''}
  <div class="row noprint mb">${DAYS.map((x,i)=>`<button class="pillbtn sm ${d===i?'on':''}" onclick="S.shDay=${i};route()">${x}${i===todayIdx()?' · today':''}</button>`).join('')}</div>
  <div class="sechead"><h2>${DAYSL[d]} — ${code==='X'?'weekly off':SHIFTS[code].name+' · '+SHIFTS[code].time}</h2></div>
  <div class="gantt"><div class="gin">${gh}<div class="grow"><div class="gn"><a href="#person/anil">${esc(anil.name)}</a> <span class="sc ${code}" style="min-width:24px;font-size:10.5px">${code==='X'?'off':code}</span></div><div class="gtrack">${Array.from({length:13},(_,i)=>`<div class="gl" style="left:${i/12*100}%"></div>`).join('')}${bars}${isToday&&t>=WIN.s&&t<WIN.e?`<div class="nowline" style="left:${(t-WIN.s)/12*100}%"></div>`:''}</div></div></div></div>
  <div class="panel mt"><h3>Time allocation — ${DAYSL[d]} (9-hour shift)</h3><div class="mt">${hb}</div>
   ${withRows?`<div class="tblwrap mt"><table class="tbl"><tr><th>Time</th><th>Type</th><th>Activity</th><th>With</th></tr>${withRows}</table></div>`:''}</div>
  <div class="two mt">
   <div class="panel"><h3>Mandatory blocks by day</h3><div class="tblwrap mt"><table class="tbl"><tr><th>Day</th><th>Shift</th><th>BD ASM h</th><th>PM ASM h</th><th>Escalation h</th><th>Left for rest</th><th>Check</th></tr>${week}</table></div>
    <p class="small muted mt">Tuesday (JP off): the BD block is held with Rakesh. Thursday (Pradeep off): the PM block is held with the Technician Coordinators. Sunday: no Service Head on duty — the on-duty ASMs own escalations.</p></div>
   <div class="panel"><h3>Analysis theme for the flexible block</h3><div class="tblwrap mt"><table class="tbl"><tr><th>Day</th><th>Theme</th></tr>${DAYS.map((x,i)=>`<tr><td><b>${x}</b></td><td class="small">${rosterCode(anil,i)==='X'?'<span class="muted">Weekly off</span>':esc(FLEX[i]||'Buffer')}</td></tr>`).join('')}</table></div></div>
  </div>
  ${c?`<div class="sechead"><h2>Is the time enough?</h2><span class="tagx ${cl==='over'?'t-p0':cl==='near'?'t-p1':'t-ok'}">${lab} · ${Math.round(c.util*100)}%</span></div>
  <div class="grid g4"><div class="stat"><div class="v num">${f1(c.avail)}</div><div class="l">Rostered h / week (${c.wd} days × 9)</div></div><div class="stat"><div class="v num">−${f1(c.brk)}</div><div class="l">Breaks</div></div><div class="stat"><div class="v num">−${f1(c.fixed)}</div><div class="l">Mandatory ASM + escalation blocks</div></div><div class="stat ${cl==='over'?'bad':cl==='near'?'warn':'good'}"><div class="v num">${f1(c.prod)} vs ${f1(c.assigned)}</div><div class="l">Free hours vs weekly / monthly duties</div></div></div>
  <div class="two mt"><div class="panel"><h3>Duties that must fit in ≈ ${f1(weekFlex)} h / week</h3><div class="tblwrap mt"><table class="tbl"><tr><th>Duty</th><th>Driver</th><th>h / week</th></tr>${c.items.map(i=>`<tr><td class="small">${esc(i.label)}</td><td class="small muted">${esc(unitLabel(i.unit))} · ${i.min} min</td><td class="num"><b>${f1(i.h)}</b></td></tr>`).join('')}<tr><td><b>Total</b></td><td></td><td class="num"><b>${f1(c.assigned)}</b></td></tr></table></div><p class="tiny muted">Minutes are placeholders. Edit them on <a href="#live">Live Workload</a>.</p></div>
   <div class="panel"><h3>Finding and options</h3><p class="small">${c.util>1?`<b>Not sufficient.</b> The 6 mandatory hours leave ${f1(c.prod)} h/week, below the ${f1(c.assigned)} h/week of weekly and monthly duties. There is no buffer for unplanned escalations, customer visits or leadership meetings.`:`Sufficient at current placeholder values, with ${f1(c.prod-c.assigned)} h/week of buffer.`}</p>
    <ul class="clean small"><li><b>Automate reports.</b> Build Reports 4–6 as Zoho Analytics dashboards over FSM + Desk + Books so the Service Head reviews, not prepares (saves ≈ 2–3 h/week).</li>
    <li><b>Merge quality reviews.</b> One weekly BD + PM quality review with both ASMs instead of two.</li>
    <li><b>Delegate transactional work.</b> Vendor payout to Finance / Books; technician recruitment sourcing to HR, with the Service Head doing final interviews only.</li>
    <li><b>Shorten fixed blocks when volume is low.</b> Make the 2 h escalation block “up to 2 h”, releasing time when the Report 3 queue is empty.</li>
    <li><b>Formalise escalation cover.</b> On the weekly off and outside the Service Head shift, the on-duty ASM is the escalation owner (P0-2).</li></ul></div></div>`:''}`;

function resolveOwner(s){ s=String(s||'').trim().toLowerCase(); if(!s) return null; const p=PEOPLE.find(p=>p.id===s||p.name.toLowerCase()===s||(p.full&&p.full.toLowerCase()===s)||(p.alias&&p.alias.toLowerCase()===s)); return p?p.id:null; }
function parseCSV(txt){ const rows=[]; let row=[],cur='',q=false; for(let i=0;i<txt.length;i++){ const ch=txt[i];

  else if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; } else cur+=ch; }
  row.push(cur); if(row.some(x=>x!=='')) rows.push(row); return rows; }

  const pmOwn=['Mrunal','Rakhi',S.scen==='A'?'Vivek':'Rahul']; const hrs=h=>{ const d=new Date(now-h*3600e3); return d.toISOString().slice(0,16).replace('T',' '); };

  const map=[['BD 1–2','Desk Ticket: Open','CC logs ticket and slot'],['BD 3 / PM 3','FSM Request → Work Order: New','Request converted; W/O created'],['BD 4 / PM 4','Service Appointment: Scheduled','Slot assigned to technician / crew'],['BD 6','Service Appointment: Dispatched','Technician notified'],['BD 7A–7B','Trip started / ended','Travel tracked on FSM mobile app'],['BD 7C','Service Appointment: In Progress','Work started (timesheet)'],['BD 7D','Asset verified','MAC / serial scanned = device_id join key'],['BD 7E','Job sheet / service report','Signed by customer'],['BD 7F–7G','Service Appointment: Completed · return trip','Work done'],['BD 8','RCA (custom picklist)','Coordinator fills RCA'],['BD 9 / PM 15','Work Order: Completed','W/O closed'],['BD 10 / PM 16','Desk Ticket: Closed','Ticket closure'],['BD 11–13','W/O pending reason (custom) · child W/O','Follow-up / spare / FoC'],['BD 15','Estimate: Sent → Accepted / Declined','Quotation to customer'],['BD 14, 16','Invoice (Books) · ₹0 for FoC','Billing + warehouse'],['BD 23–24','Escalation flag (custom)','Customer disagrees → ASM'],['PM 1–4','Scheduled Maintenance plan → auto W/O + SA','Monthly PM plan']];
  return `<div class="phead"><div><h1>Zoho FSM data model</h1><p class="sub">How each workflow step lands in Zoho Desk, FSM and Books, and which fields every KPI needs. Universal join key: <b>MAC address</b> = device_id = Serial Number = mac_id__C = DeviceID.</p></div></div>
  <div class="panel"><h3>Data flow</h3><div class="row mt" style="gap:8px;flex-wrap:wrap">${['Zoho Desk — Ticket (CC)','FSM Request','FSM Work Order','Service Appointment + Trips + Timesheet','Asset (MAC)','Estimate / Invoice (Books)','Zoho Analytics dashboards'].map((x,i,a)=>`<span class="tagx ${i===0?'t-p2':i===a.length-1?'t-bd':i===5?'t-ok':'t-pm'}" style="font-size:13px;padding:6px 12px">${esc(x)}</span>${i<a.length-1?'<b class="muted">›</b>':''}`).join('')}</div>
   <p class="small muted mt">Truth Engine (IoT telemetry) can join on MAC to flag failing units before a ticket is raised and to validate PM work — a Phase 4 item.</p></div>
  <div class="sechead"><h2>Workflow stage → FSM status</h2><span class="note">Mapping proposed from standard Zoho FSM objects — confirm against CircoLife configuration</span></div>
  <div class="tblwrap"><table class="tbl"><tr><th>Step</th><th>FSM object / status</th><th>Meaning</th></tr>${map.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="small">${esc(r[2])}</td></tr>`).join('')}</table></div>
  <div class="sechead"><h2>Data dictionary</h2><div class="row noprint">${['all','S','C','X'].map(k=>`<button class="pillbtn sm ${S.fStatus===k?'on':''}" onclick="S.fStatus='${k}';route()">${k==='all'?'All':st[k][0]} <span class="muted">${k==='all'?FIELDS.length:FIELDS.filter(f=>f[2]===k).length}</span></button>`).join('')}</div></div>
  <div class="tblwrap"><table class="tbl"><tr><th>Field</th><th>Source object</th><th>Status</th><th>Used for</th><th>Notes / IDs</th></tr>${L.map(f=>`<tr><td><b>${esc(f[0])}</b></td><td class="small">${esc(f[1])}</td><td><span class="tagx ${st[f[2]][1]}">${st[f[2]][0]}</span></td><td class="small">${esc(f[3])}</td><td class="tiny muted">${esc(f[4])}</td></tr>`).join('')}</table></div>
  <div class="panel mt"><h3>Zoho Analytics workspaces</h3><div class="tblwrap mt"><table class="tbl"><tr><th>Workspace</th><th>Workspace ID</th><th>Key view</th></tr><tr><td>CircoDB</td><td class="num">441267000006399508</td><td class="num">441267000006399514</td></tr><tr><td>Zoho FSM</td><td class="num">441267000002815063</td><td class="num">Assets 441267000002852308</td></tr><tr><td>Zoho Desk</td><td class="num">441267000000130002</td><td class="num">Tickets 441267000000130021</td></tr><tr><td>Zoho Books</td><td class="num">441267000000016002</td><td class="num">Subscriptions 441267000000695420</td></tr></table></div></div>`;
}

/* =========================== RISKS / DECISIONS =========================== */
function pgRisks(){
  const grp=pr=>ISSUES.filter(i=>i.pr===pr).map(issueHTML).join('');
  const V=S.vol;
  const assumptions=[`Coverage window 08:00–20:00, 7 days`,`Shift A 08:00–17:00, Shift B 11:00–20:00, General 09:30–18:30 — each 9 h including a 1 h break`,`Handovers 11:00 (B joins) and 16:30–17:00 (A leaves)`,`${V.bd} BD tickets and ${V.pm} PM visits per day; ${V.fuPct}% BD follow-up, ${V.billPct}% billable, ${V.agreePct}% accepted`,`${V.techBD} BD technicians; ${V.pmTeams} PM vendor teams; ${V.bdVisitMin} / ${V.pmVisitMin} min per visit incl. travel`,`${V.meet} h/day huddles and handovers per coordinator`,`Backup carries 1/7 of the primary’s volume (weekly off cover)`,`Load thresholds: under < 85%, near 85–100%, over > 100%`,`T+n measured in calendar days from ticket creation`];
  const phases=[['Phase 1 — Confirm (week 1–2)','Answer P0 questions; fix owners for step 23 and SC3; confirm shift times, CC and TC headcount; freeze roster v1.'],['Phase 2 — Configure FSM (week 2–5)','Create custom fields (pending reason, RCA picklist, escalation flag, parent W/O, coordinator owner, SLA due); set Scheduled Maintenance for PM; map Desk ↔ FSM statuses; enforce MAC on every W/O.'],['Phase 3 — Dashboards (week 4–8)','Build BD, PM, individual and management dashboards in Zoho Analytics; automate Reports 1–6 and 10; replace manual reports.'],['Phase 4 — Calibrate (month 2–3)','Use 4–8 weeks of FSM timesheets and ticket history to replace placeholder minutes and volumes; rebalance roster and headcount; link Truth Engine telemetry on MAC.'],['Phase 5 — Scale (month 3+)','Replicate the model to the other five cities; feed Subscriber 360 and B2B Dashboard 2.0; savings reports now, certified ESG reporting on the 2027 roadmap.']];
  const cf=FIELDS.filter(f=>f[2]!=='S');
  return `<div class="phead"><div><h1>Risks, decisions and open questions</h1><p class="sub">P0 must be answered before the roster and dashboards are finalised. P1 changes the design. P2 is clean-up.</p></div></div>
  <div class="grid g3 mb"><div class="stat bad"><div class="v num">${ISSUES.filter(i=>i.pr==='p0').length}</div><div class="l">P0 — blocking</div></div><div class="stat warn"><div class="v num">${ISSUES.filter(i=>i.pr==='p1').length}</div><div class="l">P1 — design</div></div><div class="stat"><div class="v num">${ISSUES.filter(i=>i.pr==='p2').length}</div><div class="l">P2 — clean-up</div></div></div>
  <div class="sechead"><h2>P0 — answer before finalising</h2></div>${grp('p0')}
  <div class="sechead"><h2>P1 — design decisions</h2></div>${grp('p1')}
  <div class="sechead"><h2>P2 — clean-up</h2></div>${grp('p2')}
  <div class="two mt"><div class="panel"><h3>Assumptions in this draft</h3><ul class="clean small">${assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul><p class="tiny muted">Volumes and minutes are editable on <a href="#live">Live Workload</a>.</p></div>
   <div class="panel"><h3>Roadmap</h3>${phases.map(p=>`<div class="phase"><b>${esc(p[0])}</b><div class="small">${esc(p[1])}</div></div>`).join('')}</div></div>
  <div class="panel mt"><h3>FSM fields to create or source (${cf.length})</h3><ul class="clean small">${cf.map(f=>`<li><b>${esc(f[0])}</b> <span class="muted">— ${esc(f[1])} · ${esc(f[3])}</span></li>`).join('')}</ul><a class="pillbtn sm mt" href="#data">Full data dictionary</a></div>`;
}

/* =========================== SEARCH =========================== */
function searchIndex(){ const I=[];
  Object.entries(BD_STEPS).forEach(([k,s])=>I.push({k:'BD step '+k,t:s.act,x:(s.act+' '+s.fsm+' '+s.out+' '+(s.raw||'')).toLowerCase(),h:'bd/'+k}));
  Object.entries(PM_STEPS).forEach(([k,s])=>I.push({k:'PM step '+k,t:s.act,x:(s.act+' '+(s.fsm||'')+' '+(s.out||'')+' '+(s.raw||'')).toLowerCase(),h:'pm/'+k}));
  people().forEach(p=>I.push({k:'Person',t:p.name+' — '+p.role,x:(p.name+' '+(p.full||'')+' '+(p.alias||'')+' '+p.role+' '+(p.summary||'')).toLowerCase(),h:'person/'+p.id}));
  DASH.forEach(d=>I.push({k:'Dashboard · '+d.g,t:d.n,x:(d.n+' '+d.q+' '+d.f.join(' ')).toLowerCase(),h:'kpi'}));
  FIELDS.forEach(f=>I.push({k:'FSM field',t:f[0],x:(f.join(' ')).toLowerCase(),h:'data'}));
  ISSUES.forEach(i=>I.push({k:i.id,t:i.t,x:(i.id+' '+i.t+' '+i.d+' '+(i.q||'')).toLowerCase(),h:'risks'}));
  PAGES.forEach(p=>I.push({k:'Page',t:p[1],x:p[1].toLowerCase(),h:p[0]}));
  return I; }
(function(){ const q=$('#q'), r=$('#sres');
  q.addEventListener('input',()=>{ const v=q.value.trim().toLowerCase(); if(v.length<2){ r.style.display='none'; return; }
    const terms=v.split(/\s+/); const hits=searchIndex().filter(i=>terms.every(t=>i.x.includes(t)||i.t.toLowerCase().includes(t))).slice(0,14);
    r.innerHTML=hits.length?hits.map(h=>`<a href="#${h.h}" onclick="document.getElementById('sres').style.display='none'"><div class="k">${esc(h.k)}</div>${esc(h.t)}</a>`).join(''):'<div class="small muted" style="padding:12px">No match</div>'; r.style.display='block'; });
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const a=r.querySelector('a'); if(a){ location.hash=a.getAttribute('href'); r.style.display='none'; q.blur(); } } if(e.key==='Escape'){ r.style.display='none'; q.blur(); } });
  document.addEventListener('click',e=>{ if(!e.target.closest('.search')) r.style.display='none'; });
})();

/* =========================== INIT =========================== */
route();
setInterval(()=>{ const pg=(location.hash||'#home').slice(1).split('/')[0]; if(['home','sh'].includes(pg)&&!document.querySelector('input:focus')) route(); else document.querySelectorAll('.clock').forEach(c=>c.textContent=hm(nowH())); },60000);
</script>
